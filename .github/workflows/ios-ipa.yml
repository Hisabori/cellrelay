name: Sideloadly unsigned IPA
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build PC app and run regression tests
        shell: pwsh
        run: |
          dotnet build windows/CellRelay.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet windows/bin/Release/net8.0-windows/CellRelay.dll --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content self-test-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PC-regression-results
          path: self-test-result.txt
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Build unsigned device application
        run: bash ios/Build-iOS.sh
      - name: Validate device IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, plistlib, struct, zipfile
          from pathlib import Path
          path = Path('ios/build/CellRelay-unsigned.ipa')
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None, 'Corrupted IPA'
              prefix = 'Payload/CellRelay.app/'
              info = plistlib.loads(z.read(prefix + 'Info.plist'))
              executable = z.read(prefix + info['CFBundleExecutable'])
              assert executable[:4] == b'\xcf\xfa\xed\xfe', 'Expected 64-bit Mach-O'
              assert struct.unpack('<I', executable[4:8])[0] == 0x0100000c, 'Expected arm64 device binary'
              assert info['CFBundleIdentifier'] == 'dev.cellrelay.test'
              assert info['NSLocalNetworkUsageDescription']
              assert '_cellrelay._tcp' in info['NSBonjourServices']
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              assert prefix + 'embedded.mobileprovision' not in z.namelist(), 'Expected unsigned IPA'
              result = {'file': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'bundle_id': info['CFBundleIdentifier'], 'minimum_ios': info['MinimumOSVersion'], 'architecture': 'arm64', 'unsigned': True, 'device_installation_tested': False, 'carrier_accounting_tested': False}
          Path('ios/build/IPA-validation.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CellRelay-Sideloadly-unsigned
          path: |
            ios/build/CellRelay-unsigned.ipa
            ios/build/IPA-validation.json
          if-no-files-found: error
          retention-days: 14
