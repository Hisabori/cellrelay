name: CellRelay
options:
  bundleIdPrefix: dev.cellrelay
  deploymentTarget:
    iOS: '16.0'
targets:
  CellRelay:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cellrelay.test
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'PC와 연결하여 테스트 트래픽을 셀룰러로 중계합니다.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CellRelay
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '3'
    info:
      path: Info.plist
      properties:
        NSBonjourServices: ['_cellrelay._tcp']
